name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: location_core
        working-directory: packages/location_core
        run: dart pub get && dart analyze && dart test
      - name: mock_location_kit
        working-directory: packages/mock_location_kit
        run: flutter pub get && flutter analyze && flutter test
      - name: controller
        working-directory: apps/controller
        run: flutter pub get && flutter analyze && flutter test
      - name: example_target
        working-directory: apps/example_target
        run: flutter pub get && flutter analyze
      - name: Guard pemakaian lokasi
        run: tool/check_location_usage.sh apps/example_target

  prod-apk-guard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK prod
        working-directory: apps/example_target
        run: flutter build apk --flavor prod -t lib/main_prod.dart
      - name: Guard APK prod tanpa kode mock
        run: tool/check_prod_apk.sh apps/example_target/build/app/outputs/flutter-apk/app-prod-release.apk
